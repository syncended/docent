name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - run: build/set-version.sh "${GITHUB_REF_NAME#v}"
      # MinGW (for tree-sitter's cgo) and NSIS come with the runner image.
      - run: wails3 package
      - name: Collect artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          mv bin/docent-amd64-installer.exe "dist/docent-${version}-windows-amd64-installer.exe"
          7z a "dist/docent-${version}-windows-amd64.zip" ./bin/docent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - run: build/set-version.sh "${GITHUB_REF_NAME#v}"
      - run: wails3 task darwin:package:universal
      - run: wails3 task darwin:create:dmg
      - name: Collect artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          mv bin/*.dmg "dist/docent-${version}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Docent ${GITHUB_REF_NAME}" --generate-notes $prerelease
